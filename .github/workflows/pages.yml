name: Build audio and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mandarim-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages-artifact: ${{ steps.package-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech generator
        run: pip install edge-tts==7.2.8
      - uses: actions/cache@v4
        with:
          path: dist/audio
          key: mandarin-audio-v1-${{ hashFiles('dist/content.json', 'scripts/generate_audio.py') }}
          restore-keys: mandarin-audio-v1-
      - name: Generate all 150 reference recordings
        run: python scripts/generate_audio.py
      - name: Validate content, JavaScript and audio
        run: |
          node --check dist/app.mjs
          node --check dist/analysis.mjs
          node --test tests/*.test.mjs
          python scripts/validate.py --audio
      - uses: actions/upload-artifact@v4
        with:
          name: mandarim-rotina-site-${{ github.run_attempt }}
          path: dist
          retention-days: 30
      - name: Identify this build package
        id: package-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.package-name.outputs.name }}
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for automatic branch publication
        uses: actions/github-script@v7
        with:
          script: |
            const site = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (site.data.build_type === 'workflow') {
              core.info('Pages uses GitHub Actions; no branch build to wait for.');
              return;
            }
            core.info('Waiting for automatic branch publication before deploying the application.');
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const automatic = data.workflow_runs.filter(run =>
                run.id !== context.runId && run.name === 'pages build and deployment');
              if (automatic.length && automatic.every(run => run.status === 'completed')) {
                core.info('Automatic branch publication finished. Publishing the application last.');
                return;
              }
              if (!automatic.length && attempt >= 3) {
                core.info('No automatic branch publication found for this commit.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Automatic branch publication is still running. Retry this deployment after it finishes.');
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages-artifact }}
      - name: Verify live application and audio
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          def read(path):
              url = base + path + '?build=' + os.environ['GITHUB_SHA']
              with urllib.request.urlopen(url, timeout=20) as response:
                  assert response.status == 200
                  return response.read()
          for attempt in range(12):
              try:
                  html = read('').decode()
                  assert 'id="workspace"' in html, 'The public page is not the practice application'
                  content = json.loads(read('content.json'))
                  phrases = [p for island in content['islands'] for p in island['phrases']]
                  assert len(phrases) == 150
                  manifest = json.loads(read('audio/manifest.json'))
                  assert len(manifest) == 150
                  for island in content['islands']:
                      for phrase in [island['phrases'][0], island['phrases'][-1]]:
                          assert len(read(phrase['audio'])) > 1500
                  print('LIVE OK: practice application, 150 phrases, 150 audio entries and 10 served MP3 samples')
                  print(base)
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print(f'Waiting for Pages propagation: {error}')
                  time.sleep(10)
          PY
